schemaVersion: 1
# CQ OS 模型路由映射。声明每个角色/任务类别的推荐模型选择。
# 目标必须是 DSH 已注册的 provider/model（由 tools/cq-routemap.mjs 校验，真实 provider 见 DSH settings）。
# 基于 DSH 原生 per-agent provider/model；落地到 preset 角色行时通过 dsh-tool-subagent 的 agentOptions 绑定。
default:
  provider: zai-coding-cn
  model: GLM-5.3
  reason: 默认路由（编码/常规）
byRole:
  architect:
    provider: deepseek-official
    model: deepseek-v4-flash
    reason: 架构/技术选型需强推理
  review:
    provider: deepseek-official
    model: deepseek-v4-flash
    reason: 只读审查需强推理
  developer:
    provider: zai-coding-cn
    model: GLM-5.3
    reason: 代码实现/落地
  tester:
    provider: zai-coding-cn
    model: GLM-5.3
    reason: 测试设计与验证
  devops:
    provider: zai-coding-cn
    model: GLM-5.3
    reason: 环境/CI-CD/部署
  product:
    provider: codex-for
    model: gpt-5.6-sol
    reason: 需求分析（通用）
  research:
    provider: codex-for
    model: gpt-5.6-sol
    reason: 开源调研（通用/联网）
  ux:
    provider: codex-for
    model: gpt-5.6-sol
    reason: 交互设计（通用）
  ui:
    provider: codex-for
    model: gpt-5.6-sol
    reason: 视觉设计（通用）
byComplexity:
  high:
    provider: deepseek-official
    model: deepseek-v4-flash
    reason: 高复杂度任务用强推理
  low:
    provider: zai-coding-cn
    model: GLM-5.3
    reason: 低成本任务
