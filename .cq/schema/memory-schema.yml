schemaVersion: 1
kind: cq-memory
sourceOfTruth: markdown
required:
  - id
  - type
  - status
  - updatedAt
allowedTypes:
  - project
  - decision
  - progress
  - execution-summary
  - bug
  - preference
  - tech-debt
  - version
# execution-summary required metadata (V2 §二十三 / Final Hardening):
#   agent, task, commit, version, startedAt, completedAt
executionSummaryRequired:
  - agent
  - task
  - commit
  - version
  - startedAt
  - completedAt
legacyStatus: legacy
index:
  path: .cq/index.json
  derived: true
  tracked: false
  rebuildable: true
